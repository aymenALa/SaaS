services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      JOB_WORKERS: "1"
      MAX_UPLOAD_BYTES: "10485760"
      TEMP_DIR: /service/data
    volumes:
      - privacy-data:/service/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  privacy-data:
